<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Klingon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23242B28'/%3E%3Ccircle cx='32' cy='32' r='11' fill='none' stroke='white' stroke-width='4'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
/* ============================================================
   Klingon ・ 認知與輸出系統（最終版）
   Perplexity 紙白 × 雜誌卡片 × 打孔票根 × 沉浸抽屜
   ============================================================ */
:root {
  --bg-paper: #FBFAF4;
  --bg-sidebar: #F8F7F0;
  --bg-card: #FFFFFF;
  --border-ecru: #E6E2D4;
  --sage: #EEF3EE;
  --text-main: #242B28;
  --text-body: #424C49;
  --text-muted: #798784;
  --accent: #20808D;
  --accent-deep: #345C4B;
  --accent-soft: rgba(32, 128, 141, 0.08);
  --stamp-red: #D24738;
  --ticket-bg: #F5F3E9;
  --serif: Georgia, Charter, "Noto Serif SC", "Noto Serif TC", serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { height: 100%; }
body {
  min-height: 100vh;
  background: var(--bg-paper);
  color: var(--text-main);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent-soft); }
button { font-family: inherit; border: 0; background: none; cursor: pointer; color: inherit; }
input, textarea { font-family: inherit; color: var(--text-main); }
svg { display: block; }
.tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

/* ================= 空間景深 ================= */
.app {
  display: flex; min-height: 100vh;
  transform-origin: 50% 0;
  transition: transform 320ms cubic-bezier(0.16, 1, 0.3, 1), filter 320ms cubic-bezier(0.16, 1, 0.3, 1);
}
body.scene-dim .app { transform: scale(0.975); filter: brightness(0.92); }

/* ================= 側欄 ================= */
.sidebar {
  width: 220px; flex-shrink: 0;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-ecru);
  padding: 16px 12px;
  display: flex; flex-direction: column; gap: 22px;
  position: sticky; top: 0; height: 100vh;
  transition: width .28s cubic-bezier(.3,.8,.3,1);
  overflow: hidden; z-index: 40;
}
body.sb-min .sidebar { width: 64px; padding: 16px 10px; }

.sb-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand span { font-size: 15px; font-weight: 600; color: var(--text-main); white-space: nowrap; }
.brand .ver {
  font-style: normal; font-size: 9px; font-weight: 700; color: #20808D;
  background: var(--accent-soft); border-radius: 4px; padding: 1px 4px;
  vertical-align: 2px; margin-left: 2px; letter-spacing: .02em;
}
.sb-actions { display: flex; gap: 4px; }
.icon-btn {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  display: grid; place-items: center; color: var(--text-muted);
  transition: background .18s, color .18s;
}
.icon-btn:hover { background: rgba(0,0,0,.05); color: var(--text-main); }

.routine { position: relative; display: flex; flex-direction: column; gap: 2px; }
.routine::before {
  content: ""; position: absolute; left: 23px; top: 20px; bottom: 20px;
  width: 1.5px; background: var(--border-ecru);
}
.rt-item {
  position: relative; display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 10px;
  font-size: 14px; font-weight: 500; color: var(--text-body);
  transition: background .18s, color .18s; text-align: left; white-space: nowrap;
}
.rt-item:hover { color: var(--text-main); }
.rt-item.active { background: #EBEBE6; color: var(--text-main); }
.rt-ico {
  width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
  background: var(--bg-sidebar); z-index: 1;
  display: grid; place-items: center; color: var(--text-muted);
  transition: background .18s, color .18s;
}
.rt-item.active .rt-ico { background: #EBEBE6; color: var(--accent); }
.rt-num { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.rt-item.active .rt-num { color: var(--text-main); }

.sb-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }
.foot-link {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px;
  font-size: 12px; color: var(--text-muted); white-space: nowrap;
  transition: background .18s, color .18s; text-align: left;
}
.foot-link:hover { background: rgba(0,0,0,.04); color: var(--text-main); }
.foot-link.armed { color: var(--stamp-red); font-weight: 600; }

/* ================= 主舞台 ================= */
.stage { flex: 1; min-width: 0; padding: 34px 24px 90px; }
.view { max-width: 620px; margin: 0 auto; }

.view-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.page-title, .head-left h2 {
  font-family: var(--serif); font-size: 19px; font-weight: 600;
  letter-spacing: -.01em; white-space: nowrap; color: var(--text-main);
}
.head-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.badge {
  width: 28px; height: 28px; border-radius: 9px; flex-shrink: 0;
  display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent);
}
.clock-line { font-size: 13px; color: var(--text-muted); }

.btn-accent-o {
  display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--accent); color: var(--accent);
  font-size: 12.5px; font-weight: 500;
  padding: 7px 14px; border-radius: 9px; background: transparent;
  transition: background .18s, color .18s, transform .18s;
  white-space: nowrap;
}
.btn-accent-o:hover { background: var(--accent); color: #fff; transform: translateY(-1px); }
.btn-accent-o:active { transform: scale(.97); }

.card {
  background: var(--bg-card);
  border: 1px solid var(--border-ecru);
  border-radius: 14px;
  box-shadow: 0 2px 10px rgba(60, 60, 40, 0.03);
}

/* ================= 晨間 ================= */
.todo-card { padding: 18px 20px 8px; }
.todo-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 14px; }
.todo-head-left { display: flex; align-items: center; gap: 10px; }
.sun-badge {
  width: 32px; height: 32px; border-radius: 10px;
  display: grid; place-items: center;
  background: var(--accent-soft);
  transition: background .6s;
}
.sun-badge.full { background: rgba(255, 210, 166, 0.5); }
.todo-head-right { display: flex; align-items: center; gap: 10px; }
.todo-head-right .num { font-size: 13px; color: var(--text-muted); }

.t-list { list-style: none; position: relative; }
.t-row {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 26px 11px 0; border-top: 1px solid rgba(230, 226, 212, .55);
  position: relative;
  transition: opacity .25s, transform .25s;
  user-select: none; -webkit-user-select: none;
}
.t-row.dragging {
  opacity: .5; background: var(--bg-card);
  box-shadow: 0 10px 26px rgba(40, 50, 45, .16);
  border-radius: 12px; z-index: 5;
  transition: opacity .2s, box-shadow .2s;
}
.drop-line {
  position: absolute; left: 6px; right: 6px; height: 2px;
  border-radius: 2px; background: var(--accent);
  opacity: 0; pointer-events: none; z-index: 4;
  transition: transform .12s ease, opacity .12s;
}
.t-row.leaving { opacity: 0; transform: translateX(10px); }
.t-row:first-child { border-top: 0; }
.t-chk { width: 22px; height: 22px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; transition: transform .15s; }
.t-chk:hover { transform: scale(1.08); }
.t-chk:active { transform: scale(.92); }
.t-row.done .t-chk svg .fill-c { animation: popIn .3s cubic-bezier(.2,.9,.3,1.3) both; }
.t-chk svg path { stroke-dasharray: 20; stroke-dashoffset: 20; }
.t-row.done .t-chk svg path { animation: draw .35s ease .05s both; }
@keyframes popIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
.t-text { flex: 1; font-size: 14px; color: var(--text-body); line-height: 1.55; min-width: 0; overflow-wrap: anywhere; transition: color .35s; }
.t-row.done .t-text { color: var(--text-muted); text-decoration: line-through; text-decoration-color: rgba(121, 135, 132, .5); }
.t-pin { color: var(--accent); flex-shrink: 0; display: none; }
.t-row.pinned .t-pin { display: block; }
.t-edit-input {
  flex: 1; min-width: 0; border: 0; border-bottom: 1.5px solid var(--accent);
  outline: none; background: transparent; font-size: 14px; padding: 2px 0;
}
.t-more {
  position: absolute; right: 0; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border-radius: 7px;
  display: grid; place-items: center;
  color: var(--text-muted); font-size: 14px; letter-spacing: 1px; font-weight: 700;
  opacity: 0; transition: opacity .15s, background .15s, color .15s;
}
.t-row:hover .t-more, .t-more:focus-visible { opacity: 1; }
.t-more:hover { background: rgba(0,0,0,.06); color: var(--text-main); }
.t-empty { padding: 14px 0; font-size: 12.5px; color: var(--text-muted); }

.quick-add { display: flex; border-top: 1px solid rgba(230,226,212,.55); margin-top: 2px; }
.quick-add input { flex: 1; border: 0; outline: none; background: transparent; padding: 12px 2px; font-size: 13.5px; }
.quick-add input::placeholder { color: #ADB6B1; }
.quick-add input[data-ghost="1"]::placeholder { color: rgba(36, 43, 40, .35); }
.quick-add input:disabled { color: var(--text-muted); }

@keyframes rise { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
.slide-in { animation: slideIn .45s cubic-bezier(.2,.8,.3,1) both; }
@keyframes slideIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.view > * { animation: fadeUp .4s cubic-bezier(.2,.7,.3,1) both; }
.view > *:nth-child(2) { animation-delay: .05s; }
.view > *:nth-child(3) { animation-delay: .1s; }
.view > *:nth-child(4) { animation-delay: .15s; }

/* ================= 輸出卡片 ================= */
.out-stack { display: flex; flex-direction: column; gap: 16px; }

.cat-bar { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; margin-bottom: 16px; }
.cat-pill {
  height: 24px; padding: 0 11px; border-radius: 999px;
  font-size: 12px; line-height: 24px; color: var(--text-muted);
  transition: color .15s, background .15s;
}
.cat-pill:hover { color: var(--text-main); }
.cat-pill.active { color: var(--text-main); background: var(--sage); }

.mg-card { padding: 20px 22px 16px; transition: box-shadow .25s; }
.mg-card:hover { box-shadow: 0 5px 20px rgba(60, 60, 40, 0.07); }
.mg-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mg-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
.mg-chip {
  font-size: 10.5px; font-weight: 600; letter-spacing: .08em;
  color: var(--accent-deep); background: var(--sage);
  border-radius: 6px; padding: 3px 9px; text-transform: uppercase;
  transition: background .15s, transform .1s;
}
.mg-chip:hover { background: #E2EAE2; }
.mg-chip:active { transform: scale(.96); }
.mg-date { font-size: 11.5px; color: var(--text-muted); }
.mg-prog { font-size: 11.5px; color: var(--text-muted); }
.mg-right { display: flex; align-items: center; gap: 6px; }
.mg-more {
  width: 24px; height: 24px; border-radius: 7px;
  display: grid; place-items: center;
  color: var(--text-muted); font-size: 14px; font-weight: 700; letter-spacing: 1px;
  opacity: 0; transition: opacity .15s, background .15s, color .15s;
}
.mg-card:hover .mg-more, .mg-more:focus-visible { opacity: 1; }
.mg-more:hover { background: rgba(0, 0, 0, .06); color: var(--text-main); }
.mini-ico {
  width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
  display: grid; place-items: center; color: var(--text-muted);
  transition: background .15s, color .15s;
}
.mini-ico:hover { background: var(--sage); color: var(--text-main); }

.mg-title {
  font-family: var(--serif); font-size: 17.5px; font-weight: 600;
  letter-spacing: -.005em; line-height: 1.5; color: var(--text-main);
  margin-top: 10px; overflow-wrap: anywhere;
}
.mg-excerpt {
  margin-top: 12px; font-size: 14px; line-height: 1.75; color: var(--text-body);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  white-space: pre-line; overflow-wrap: anywhere;
}
.mg-guide { margin-top: 12px; font-size: 12.5px; color: var(--text-muted); }
.mg-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(230, 226, 212, .6);
}
.mg-stat { font-size: 11.5px; color: var(--text-muted); }
.readmore {
  font-size: 12.5px; font-weight: 600; color: var(--accent);
  display: flex; align-items: center; gap: 3px;
  padding: 5px 10px; border-radius: 8px;
  transition: background .15s, transform .1s;
}
.readmore:hover { background: var(--accent-soft); }
.readmore:active { transform: scale(.97); }

/* 思想展覽打孔票根 */
.ticket {
  position: relative; display: flex;
  background: var(--ticket-bg);
  border: 1px solid var(--border-ecru);
  border-radius: 9px; margin-top: 13px;
}
.ticket::before, .ticket::after {
  content: ""; position: absolute; top: 50%; width: 12px; height: 12px;
  border-radius: 50%; background: var(--bg-paper);
  border: 1px solid var(--border-ecru);
  transform: translateY(-50%); z-index: 1;
}
.ticket::before { left: -6.5px; }
.ticket::after { right: -6.5px; }
.stub {
  flex: 1; position: relative; min-width: 0;
  padding: 7px 6px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.stub + .stub { border-left: 1.5px dashed var(--border-ecru); }
.stub-no { font-size: 8px; font-weight: 600; letter-spacing: .13em; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.stub-state { display: flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; letter-spacing: .06em; color: #A8B0AD; font-variant-numeric: tabular-nums; }
.stub-state svg { flex-shrink: 0; }
.stub.state-done .stub-state { color: var(--text-main); }
.stub.state-now .stub-state { color: var(--accent); }
.stamp {
  position: absolute; top: 3px; right: 6px;
  transform: rotate(-8deg);
  border: 1.5px solid var(--stamp-red); color: var(--stamp-red);
  border-radius: 4px; padding: 1px 4px;
  font-size: 7.5px; font-weight: 700; letter-spacing: .08em;
  line-height: 1.25; text-align: center; font-variant-numeric: tabular-nums;
  opacity: .92;
}
.stamp.stamp-in { animation: stampIn .38s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes stampIn {
  0% { opacity: 0; transform: rotate(-24deg) scale(2); }
  100% { opacity: .92; transform: rotate(-8deg) scale(1); }
}

/* 歷史歸檔 */
.archive { margin-top: 16px; overflow: hidden; }
.archive-toggle {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 13px 16px; font-size: 13px; font-weight: 500; color: var(--text-body);
  transition: background .18s; text-align: left;
}
.archive-toggle:hover { background: rgba(0, 0, 0, .02); }
.archive-toggle .cnt { color: var(--text-muted); font-weight: 400; }
.archive-toggle .chev { margin-left: auto; color: var(--text-muted); transition: transform .25s; }
.archive.open .archive-toggle .chev { transform: rotate(180deg); }
.archive-list { border-top: 1px solid rgba(230, 226, 212, .6); padding: 4px 16px 10px; }
.a-row { padding: 9px 0; border-top: 1px solid rgba(230, 226, 212, .5); }
.a-row:first-child { border-top: 0; }
.a-row b { display: block; font-size: 13px; font-weight: 600; color: var(--text-main); }
.a-row i { display: block; font-style: normal; font-size: 11px; color: var(--text-muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.a-empty { padding: 10px 0; font-size: 12px; color: var(--text-muted); }

/* ================= 閱讀抽屜（三段式信箋） ================= */
.drawer-wrap { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
.dw-backdrop {
  position: absolute; inset: 0;
  background: rgba(36, 43, 40, .32);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0; transition: opacity .3s;
}
.drawer {
  position: absolute; right: 0; top: 0; bottom: 0;
  width: min(560px, 94vw);
  background: var(--bg-card);
  border-left: 1px solid var(--border-ecru);
  box-shadow: -24px 0 70px rgba(20, 26, 23, .14);
  display: flex; flex-direction: column;
  transform: translateX(102%);
  transition: transform .38s cubic-bezier(.3,.9,.3,1);
}
.drawer-wrap.open { pointer-events: auto; }
.drawer-wrap.open .dw-backdrop { opacity: 1; }
.drawer-wrap.open .drawer { transform: none; }

.dw-top {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 20px; border-bottom: 1px solid var(--border-ecru); flex-shrink: 0;
}
.dw-cat { display: flex; align-items: center; gap: 7px; color: var(--accent-deep); min-width: 0; }
.dw-cat b { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; white-space: nowrap; }
.dw-close {
  width: 30px; height: 30px; border-radius: 8px;
  display: grid; place-items: center; color: var(--text-muted);
  transition: background .15s, color .15s, transform .12s;
}
.dw-close:hover { background: rgba(0,0,0,.05); color: var(--text-main); transform: rotate(90deg); }

.dw-scroll { flex: 1; overflow-y: auto; padding: 26px 30px 30px; }
.dw-title {
  font-family: var(--serif); font-size: 24px; font-weight: 600;
  line-height: 1.45; letter-spacing: -.01em; color: var(--text-main);
  overflow-wrap: anywhere;
}
.dw-meta { margin-top: 10px; font-size: 12.5px; color: var(--text-muted); }

/* 三段式階段標識與內容（物理級滅框 + 換行精準還原） */
.dw-sec { margin-top: 16px; }
.dw-lab {
  font-size: 11px !important; font-weight: 600 !important;
  color: #20808D !important; letter-spacing: .05em !important;
  margin: 16px 0 0 0 !important;
}
.dw-d1 {
  white-space: pre-wrap !important;
  word-break: break-word !important;
  font-family: Georgia, Charter, "Noto Serif SC", serif !important;
  font-size: 14px !important;
  line-height: 1.8 !important;
  color: #242B28 !important;
  margin: 6px 0 0 0 !important;
  overflow-wrap: anywhere;
}
.dw-editarea {
  width: 100%; min-height: 220px;
  border: none !important;
  outline: none !important;
  box-shadow: none !important;
  resize: none !important;
  background: transparent !important;
  font-family: Georgia, Charter, "Noto Serif SC", "Noto Serif TC", serif !important;
  font-size: 15px !important;
  line-height: 1.8 !important;
  color: #242B28 !important;
  white-space: pre-wrap !important;
  word-break: break-word !important;
  caret-color: var(--accent);
  margin: 6px 0 0 0 !important;
  display: block; overflow-y: auto;
}
.dw-editarea::placeholder { color: #ADB6B1; }
.dw-editarea::selection { background: var(--accent-soft); }
.dw-locked { font-size: 12.5px; color: #ADB6B1; padding: 6px 0 2px; letter-spacing: .02em; }
.dw-none { color: #ADB6B1; }

.dw-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 13px 20px; border-top: 1px solid var(--border-ecru); flex-shrink: 0;
  background: var(--bg-card);
}
.dw-btn {
  display: flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 500;
  padding: 8px 14px; border-radius: 9px;
  transition: background .15s, color .15s, transform .1s, filter .15s;
}
.dw-btn:active { transform: scale(.97); }
.dw-btn.ghost { color: var(--text-body); border: 1px solid var(--border-ecru); }
.dw-btn.ghost:hover { background: var(--sage); color: var(--text-main); }
.dw-btn.teal { color: var(--accent); border: 1px solid var(--accent); }
.dw-btn.teal:hover { background: var(--accent); color: #fff; }
.dw-btn.solid { background: var(--accent-deep); color: #fff; margin-left: auto; }
.dw-btn.solid:hover { filter: brightness(1.12); }
@keyframes shake {
  10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(2px); }
  30%, 50%, 70% { transform: translateX(-3px); } 40%, 60% { transform: translateX(3px); }
}

<script>
'use strict';
/* ============================================================
   Klingon ・ 認知與輸出系統（最終版）
   localStorage 持久化 ＋ Web Audio 多感官反饋 ＋ 零依賴
   ============================================================ */

/* ---------- 工具 ---------- */
const $  = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
const pad = n => String(n).padStart(2, '0');
const todayStr = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const daysBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);
const fullDate = s => { const [y, m, d] = s.split('-'); return `${y}/${+m}/${+d}`; };
const shortDate = s => { const p = String(s).split('-'); return `${+p[1]}/${+p[2]}`; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const summary = (t, n) => { const c = String(t || '').replace(/\s+/g, ' ').trim(); return c.length > n ? c.slice(0, n) + '…' : c; };
const restoreParas = s => String(s || '').replace(/([。！？])\s+/g, '$1\n\n');   // 單行輸入吞掉的換行（句號後空格）還原為段落
const words = t => {
  const s = String(t || '');
  const latin = (s.match(/[A-Za-z0-9'’\-]+/g) || []).length;
  const cjk = (s.match(/[\u4e00-\u9fff]/g) || []).length;
  return latin + cjk;
};
const shakeEl = el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); };

/* ---------- 分類（純英文） ---------- */
const CATS = ['Book', 'Movie', 'Show', 'Podcast', 'Life'];
const CAT_ICONS = {
  Book: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.5 5 8.5 4.5 5 4.5v13c3.5 0 5.5.5 7 2 1.5-1.5 3.5-2 7-2v-13c-3.5 0-5.5.5-7 2Z"/><path d="M12 6.5v13"/></svg>',

/* ============================================================
   自動輪替備份：每次儲存都留一份帶時間戳的副本，最多保留 20 份。

const BACKUP_KEY = 'klingon.v1.backups';
function writeRotatingBackup(serialized) {
  try {
    let list = [];
    try { list = JSON.parse(localStorage.getItem(BACKUP_KEY) || '[]'); } catch (e) { list = []; }
    if (!Array.isArray(list)) list = [];
    const last = list[list.length - 1];
    // 內容沒變就不重複存
    if (last && last.data === serialized) return;
    // 太貧乏的版本不佔位
    if (isTrivial(serialized)) return;
    list.push({ ts: Date.now(), data: serialized });
    // 逐出最舊的，同時管制總量（localStorage 通常只有 5MB）
    while (list.length > 20) list.shift();
    let total = list.reduce((a, b) => a + b.data.length, 0);
    while (list.length > 1 && total > 3000000) {
      total -= list[0].data.length;
      list.shift();
    }
    localStorage.setItem(BACKUP_KEY, JSON.stringify(list));
  } catch (e) {}
}

function save() {
  try {

    // 空物件／只有種子數據的版本不該佔用快照位，否則救援功能會拿示例數據去覆蓋真實資料。
    if (prev && !isTrivial(prev)) localStorage.setItem(KEY + '.snapshot', prev);
    const serialized = JSON.stringify(state);
    localStorage.setItem(KEY, serialized);
    localStorage.setItem('klingon.savedAt', String(Date.now()));
    localStorage.setItem(SEED_FLAG, '1');
    writeRotatingBackup(serialized);

}
/* 判斷一份存檔是否「幾乎沒內容」：示例數據或空殼都算，不值得當救援快照 */
function isTrivial(raw) {
  try {
    const o = JSON.parse(raw);
    const outs = (o.outputs || []).filter(x => !x.archived);
    const todoDays = Object.keys(o.todos || {}).length;
    const reflDays = Object.keys(o.reflect || {}).length;
    if (outs.length === 0 && todoDays === 0 && reflDays === 0) return true;
    const SEED_TITLES = ['《十一種孤獨》', '《花樣年華》重看'];
    if (outs.length === 2 && outs.every(x => SEED_TITLES.includes(x.title))) return true;
    return false;
  } catch (e) { return false; }
}

/* ---------- 多窗口數據合流：寫入前先合併他窗改動，杜絕互相覆蓋 ---------- */
function tombstone(id) {
  state.tombstones = state.tombstones || [];
  state.tombstones = state.tombstones.filter(t => t.id !== id);
  state.tombstones.push({ id, ts: Date.now() });
}
function mergeOutputs(fresh, ours, oursWins) {
  const map = new Map(fresh.map(o => [o.id, o]));
  ours.forEach(o => {
    const ex = map.get(o.id);
    if (!ex || (Number(o.updatedAt) || 0) >= (Number(ex.updatedAt) || 0)) map.set(o.id, o);
  });
  // 順序即數據：同一組輸出（無增刪）時，以最後寫入一方的排布為準
  const sameSet = fresh.length === ours.length && ours.every(o => map.has(o.id));
  if (sameSet) return (oursWins ? ours : fresh).map(o => map.get(o.id));
  const extra = ours.filter(o => !fresh.some(x => x.id === o.id));
  return [...extra, ...fresh.map(o => map.get(o.id))];
}
function mergeTodoDay(fresh, ours, oursWins) {
  const map = new Map(fresh.map(t => [t.id, t]));
  ours.forEach(t => {
    const ex = map.get(t.id);
    if (!ex || oursWins) map.set(t.id, t);
  });
  // 順序即數據：同一組待辦（無增刪）時，以最後寫入一方的手動排序為準
  const sameSet = fresh.length === ours.length && ours.every(t => map.has(t.id));
  if (sameSet) return (oursWins ? ours : fresh).map(t => map.get(t.id));
  const extra = ours.filter(t => !fresh.some(x => x.id === t.id));
  return [...extra, ...fresh.map(t => map.get(t.id))];
}
function mergeState(fresh, ours, oursWins) {
  const tombs = {};
  (ours.tombstones || []).concat(fresh.tombstones || []).forEach(t => { tombs[t.id] = Math.max(tombs[t.id] || 0, Number(t.ts) || 0); });
  const aliveO = list => list.filter(o => !(tombs[o.id] >= (Number(o.updatedAt) || 0)));
  const aliveT = list => list.filter(t => !tombs[t.id]);
  const fo = aliveO(fresh.outputs || []), oo = aliveO(ours.outputs || []);
  const out = {
    todos: {},
    outputs: mergeOutputs(fo, oo, oursWins),
    reflect: {},
    tombstones: Object.keys(tombs).map(id => ({ id, ts: tombs[id] })).sort((a, b) => b.ts - a.ts).slice(0, 200),
    ui: Object.assign({}, fresh.ui, ours.ui),
  };
  const tDates = new Set([...Object.keys(fresh.todos || {}), ...Object.keys(ours.todos || {})]);
  tDates.forEach(d => {
    out.todos[d] = mergeTodoDay(aliveT(fresh.todos[d] || []), aliveT(ours.todos[d] || []), oursWins);
  });
  const rDates = new Set([...Object.keys(fresh.reflect || {}), ...Object.keys(ours.reflect || {})]);
  rDates.forEach(d => {
    const a = fresh.reflect[d] || {}, b = ours.reflect[d] || {};
    const pick = k => String((oursWins ? (b[k] || a[k]) : (a[k] || b[k])) || '');
    out.reflect[d] = { win: pick('win'), weak: pick('weak'), step: pick('step') };
  });
  return out;
}

/* ---------- Web Audio（首次點擊自動解鎖） ---------- */
let actx = null;
function ac() {

function playClick() {
  const a = ac(); if (!a) return;
  const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(1900, t);

  const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();

  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(55, t + .12);

  g.gain.exponentialRampToValueAtTime(.001, t + .17);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + .19);
  const len = Math.floor(a.sampleRate * .09);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);

  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 950;

  master.gain.linearRampToValueAtTime(.17, t + .45);

    o.type = 'sine';
    o.frequency.value = f;
    o.detune.value = Math.random() * 6 - 3;
    g.gain.value = v;

    o.start(t); o.stop(t + D + .1);

/* 待辦拖拽排序（長按或拖動；浮雕 + 綠松石指示線） */
const tlist = $('#todo-list');
let dragSt = null;

tlist.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  if (e.target.closest('.t-chk, .t-more, .t-edit-input')) return;
  const rowEl = e.target.closest('.t-row');
  if (!rowEl || tlist.querySelectorAll('.t-row').length < 2) return;
  dragSt = {
    rowEl, id: rowEl.dataset.id,
    x0: e.clientX, y0: e.clientY,
    pointerId: e.pointerId,
    started: false,
    lpTimer: setTimeout(() => beginTodoDrag(), 300),
  };
});
function beginTodoDrag() {
  if (!dragSt || dragSt.started) return;
  dragSt.started = true;
  dragSt.rowEl.classList.add('dragging');
  const line = document.createElement('div');
  line.className = 'drop-line';
  tlist.appendChild(line);
  dragSt.line = line;
  try { dragSt.rowEl.setPointerCapture(dragSt.pointerId); } catch (err) {}
}
tlist.addEventListener('pointermove', e => {
  if (!dragSt) return;
  if (!dragSt.started) {
    if (Math.hypot(e.clientX - dragSt.x0, e.clientY - dragSt.y0) > 8) {
      clearTimeout(dragSt.lpTimer);
      beginTodoDrag();
    } else return;
  }
  e.preventDefault();
  dragSt.rowEl.style.transform = `translateY(${e.clientY - dragSt.y0}px) scale(.98)`;

  const rows = [...tlist.querySelectorAll('.t-row')].filter(r => r !== dragSt.rowEl);
  let insertAt = rows.length, lineY = null;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i].getBoundingClientRect();
    if (e.clientY < r.top + r.height / 2) { insertAt = i; lineY = r.top - 2; break; }
  }
  if (lineY === null) lineY = rows[rows.length - 1].getBoundingClientRect().bottom - 2;
  dragSt.insertAt = insertAt;
  const lr = tlist.getBoundingClientRect();
  dragSt.line.style.opacity = '1';
  dragSt.line.style.transform = `translateY(${lineY - lr.top}px)`;
});
function finishTodoDrag(e, commit) {
  if (!dragSt) return;
  clearTimeout(dragSt.lpTimer);
  const st = dragSt;
  dragSt = null;
  if (!st.started) return;
  st.rowEl.classList.remove('dragging');
  st.rowEl.style.transform = '';
  if (st.line) st.line.remove();
  todoClickSuppressed = true;
  setTimeout(() => { todoClickSuppressed = false; }, 50);
  if (!(commit && st.insertAt !== undefined)) { renderTodos(); return; }
  const arr = todosToday();
  const from = arr.findIndex(x => x.id === st.id);
  if (from < 0) { renderTodos(); return; }
  const [item] = arr.splice(from, 1);
  arr.splice(st.insertAt, 0, item);
  save();
  playClick();
  flipTodoReorder();
}
tlist.addEventListener('pointerup', e => finishTodoDrag(e, true));
tlist.addEventListener('pointercancel', e => finishTodoDrag(e, false));

function flipTodoReorder() {
  const rows = [...tlist.querySelectorAll('.t-row')];
  const firstTop = new Map(rows.map(r => [r.dataset.id, r.getBoundingClientRect().top]));
  renderTodos();
  [...tlist.querySelectorAll('.t-row')].forEach(r => {
    const f = firstTop.get(r.dataset.id);
    if (f === undefined) return;
    const dy = f - r.getBoundingClientRect().top;
    if (Math.abs(dy) < 2) return;
    r.style.transition = 'none';
    r.style.transform = `translateY(${dy}px)`;
    requestAnimationFrame(() => {
      r.style.transition = 'transform .3s cubic-bezier(.2,.8,.3,1)';
      r.style.transform = '';
      r.addEventListener('transitionend', () => { r.style.transition = ''; r.style.transform = ''; }, { once: true });
    });
  });
}

function startTodoEdit(id) {
  const li = $(`#todo-list li[data-id="${id}"]`);
  if (!li) return;
  const span = li.querySelector('.t-text');
  const old = span.textContent;
  span.innerHTML = '';
  const input = document.createElement('input');
  input.className = 't-edit-input';
  input.maxLength = 60;
  input.value = old;
  span.appendChild(input);
  input.focus();
  input.select();
  let done = false;
  const commit = ok => {
    if (done) return;
    done = true;
    const v = input.value.trim();
    if (ok && v && v !== old) {
      const t = todosToday().find(x => x.id === id);
      if (t) t.text = v;
      save();
      playClick();
      toast('已更新');
    }
    renderTodos();
  };
  input.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') commit(true);
    if (ev.key === 'Escape') commit(false);
  });
  input.addEventListener('blur', () => commit(true));
  input.addEventListener('click', ev => ev.stopPropagation());
}

          </button>

  }).join('');
  } catch (err) {

function flushDrawerSave() {
  if (!drawerId) return;

  if (!o) return;
  const t3 = $('#dw-ta3'), t7 = $('#dw-ta7');
  let dirty = false;

    o.content = t3.value; dirty = true;
  }
  if (t7 && (o.content7 || '') !== t7.value) {
    if (!(o.content7 || '').trim() && t7.value.trim() && !o.stamps[2]) o.stamps[2] = Date.now();

async function copyText(text) {
  try { window.focus(); } catch (e) {}
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (err) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }
}

/* ============================================================
   出版級導出分享卡（3:4 自適應 ＋ 紙白/曜石）

const EXP_THEMES = {
  paper: { bg: '#FBFAF4', ink: '#242B28', body: '#424C49', muted: '#798784', chipBg: '#EEF3EE', chipTx: '#345C4B', accent: '#20808D', border: '#E6E2D4', qm: 'rgba(32,128,141,0.10)', colo: '#A4B2AF' },
  dark:  { bg: '#17191B', ink: '#F2F1EC', body: '#C7CCC6', muted: '#8B948F', chipBg: 'rgba(255,255,255,0.08)', chipTx: '#9FC3BA', accent: '#7FB5AE', border: 'rgba(255,255,255,0.12)', qm: 'rgba(143,182,174,0.14)', colo: '#6E7773' },
};
const EXP_W = 450, EXP_S = 2;
const EXP_SERIF = 'Georgia, "Noto Serif SC", "Noto Serif TC", serif';
const EXP_SANS = '-apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif';

function expMeasurer() {
  const m = document.createElement('canvas').getContext('2d');
  return {
    set(font) { m.font = font; },
    wrap(text, max) {
      const out = [];
      let line = '';
      const push = () => { if (line) { out.push(line); line = ''; } };
      for (const p of String(text).split(/(\s+)/)) {
        if (!p) continue;
        if (/^\s+$/.test(p)) { if (line) line += ' '; continue; }
        if (/[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]/.test(p)) {
          for (const ch of Array.from(p)) {
            if (line && m.measureText(line + ch).width > max) { push(); line = ch; }
            else line += ch;
          }
        } else if (line && m.measureText(line + p).width > max) { push(); line = p; }
        else line += p;
      }
      push();
      return out;
    },
  };
}
function drawSpark(c, x, y, r, color) {
  c.save();
  c.strokeStyle = color; c.lineWidth = 1.5; c.lineCap = 'round';
  c.beginPath();
  c.moveTo(x, y - r); c.lineTo(x, y + r);
  c.moveTo(x - r * .87, y - r / 2); c.lineTo(x + r * .87, y + r / 2);
  c.moveTo(x + r * .87, y - r / 2); c.lineTo(x - r * .87, y + r / 2);
  c.stroke();
  c.restore();
}
function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function drawColophon(c, W, H, t, align) {
  c.save();
  c.font = '600 9px ' + EXP_SANS;
  try { c.letterSpacing = '1.35px'; } catch (err) {}
  const txt = 'KLINGON · ARCHIVE';
  const tw = c.measureText(txt).width;
  const total = 14 + 8 + tw;
  const x0 = align === 'right' ? W - 34 - total : (W - total) / 2;
  const y = H - 26;
  c.strokeStyle = t.colo; c.lineWidth = 1.4;
  roundRectPath(c, x0, y - 11, 14, 14, 4); c.stroke();
  c.beginPath(); c.arc(x0 + 7, y - 4, 3.1, 0, Math.PI * 2); c.stroke();
  c.fillStyle = t.colo;
  c.textBaseline = 'middle';
  c.fillText(txt, x0 + 22, y - 4);
  try { c.letterSpacing = '0px'; } catch (err) {}
  c.restore();
}

function renderShareCard(o, theme) {
  const t = EXP_THEMES[theme];
  const cv = document.createElement('canvas');
  const M = expMeasurer();
  const PAD = 34, MAX = EXP_W - PAD * 2;
  const bodyText = [(o.content || '').trim(), (o.content7 || '').trim()].filter(Boolean).join('\n\n')
    || o.insight || o.title;
  const short = words(bodyText) < 50;

  let H, bigLines = [], titleLines = [], bodyParas = [];
  if (short) {
    H = 600;
    M.set('600 24px ' + EXP_SERIF);
    bigLines = M.wrap(bodyText, MAX - 26);
  } else {
    M.set('600 26px ' + EXP_SERIF);
    titleLines = M.wrap(o.title, MAX);
    M.set('400 14.5px ' + EXP_SERIF);
    bodyParas = bodyText.split(/\n+/).filter(p => p.trim()).map(p => M.wrap(p, MAX));
    H = 46 + 22 + 12 + titleLines.length * 36 + 16 + 19;
    bodyParas.forEach(ls => H += ls.length * 26 + 12);
    H += 58;
    H = Math.max(H, 600);
  }

  cv.width = EXP_W * EXP_S; cv.height = H * EXP_S;
  const g = cv.getContext('2d');
  g.scale(EXP_S, EXP_S);
  g.fillStyle = t.bg; g.fillRect(0, 0, EXP_W, H);
  g.strokeStyle = t.border; g.lineWidth = 1;
  roundRectPath(g, 10.5, 10.5, EXP_W - 21, H - 21, 12); g.stroke();

  g.textBaseline = 'middle';
  g.font = '600 10px ' + EXP_SANS;
  try { g.letterSpacing = '1.2px'; } catch (err) {}
  const chipTxt = o.category.toUpperCase();
  const cw = g.measureText(chipTxt).width + 20;
  g.fillStyle = t.chipBg;
  roundRectPath(g, PAD, 31, cw, 18, 5); g.fill();
  g.fillStyle = t.chipTx;
  g.fillText(chipTxt, PAD + 10, 40.5);
  try { g.letterSpacing = '0px'; } catch (err) {}
  g.font = '400 10px ' + EXP_SANS;
  g.fillStyle = t.muted;
  g.textAlign = 'right';
  g.fillText(o.date.replace(/-/g, '/'), EXP_W - PAD - 16, 40.5);
  g.textAlign = 'left';
  drawSpark(g, EXP_W - PAD - 4, 40, 6.5, t.accent);

  if (short) {
    const LH = 38;
    const startY = (H - bigLines.length * LH) / 2;
    g.font = '400 120px ' + EXP_SERIF;
    g.fillStyle = t.qm;
    g.fillText('\u201C', PAD + 2, startY + 6);
    g.font = '600 24px ' + EXP_SERIF;
    g.fillStyle = t.ink;
    g.textAlign = 'center';
    bigLines.forEach((l, i) => g.fillText(l, EXP_W / 2, startY + (i + 1) * LH - 8));
    g.textAlign = 'left';
    drawColophon(g, EXP_W, H, t, 'center');
  } else {
    let y = 46 + 22;
    g.font = '600 26px ' + EXP_SERIF;
    g.fillStyle = t.ink;
    titleLines.forEach(l => { g.fillText(l, PAD, y + 26); y += 36; });
    y += 6;
    g.strokeStyle = t.border;
    g.beginPath(); g.moveTo(PAD, y + .5); g.lineTo(EXP_W - PAD, y + .5); g.stroke();
    y += 22;
    g.font = '400 14.5px ' + EXP_SERIF;
    g.fillStyle = t.body;
    bodyParas.forEach(ls => {
      ls.forEach(l => { g.fillText(l, PAD, y + 18); y += 26; });
      y += 12;
    });
    drawColophon(g, EXP_W, H, t, 'right');
  }
  return cv;
}

function searchAll(q) {
  q = q.trim().toLowerCase();
  const res = [];
  [...state.outputs].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.updatedAt - a.updatedAt).forEach(o => {
    const hay = (o.title + ' ' + o.insight + ' ' + o.content + ' ' + (o.content7 || '') + ' ' + o.category).toLowerCase();
    if (!q || hay.includes(q)) res.push({ type: 'output', id: o.id, text: o.title, date: o.date, pinned: o.pinned, archived: o.archived, cat: o.category });
  });
  todosToday().forEach(t => {
    if (!q || t.text.toLowerCase().includes(q)) res.push({ type: 'todo', id: t.id, text: t.text, date: todayStr(), pinned: t.pinned });
  });
  const r = state.reflect[todayStr()];
  if (r) [['win', '肯定'], ['weak', '弱點'], ['step', '一步']].forEach(([f, tag]) => {
    if (r[f] && (!q || r[f].toLowerCase().includes(q))) res.push({ type: 'reflect', field: f, text: r[f], tag, date: todayStr() });
  });
  return res.slice(0, 12);
}
function renderSpot(q) {
  const box = $('#spot-results');
  if (!q.trim()) {
    spotRows = [];
    box.innerHTML = '<p class="sp-quiet">鍵入關鍵字檢索...</p>';

  box.innerHTML = spotRows.map((r, i) => `
    <div class="sp-row" data-i="${i}" data-type="${r.type}" ${r.id ? `data-id="${r.id}"` : ''} ${r.field ? `data-field="${r.field}"` : ''}>
      ${r.type === 'output' ? `<span class="sp-chip ${r.archived ? 'arch' : ''}">${r.archived ? 'Archived' : r.cat}</span>` : `<span class="sp-chip">${r.type === 'todo' ? '晨間' : '晚思'}</span>`}
      <span class="sp-text">${r.pinned ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-1px;margin-right:4px"><path d="M9 4.5h6l-.7 6.2 3.2 3.3H6.5l3.2-3.3L9 4.5Z"/><path d="M12 14v5.5"/></svg>' : ''}${esc(r.text)}</span>

/* 行內重命名（Spotlight 列表） */
function startRename(d) {
  const row = $('#spot-results').querySelector(`.sp-row[data-id="${d.id}"]`);
  const span = row && row.querySelector('.sp-text');
  let input, old;
  if (span) {
    old = spotRows[+row.dataset.i] ? spotRows[+row.dataset.i].text : '';
    span.innerHTML = '';
    input = document.createElement('input');
    input.maxLength = 90;
    input.value = old;
    span.appendChild(input);
  } else if (d.kind === 'todo') {
    startTodoEdit(d.id);
    return;
  } else return;
  input.focus();
  input.select();
  let done = false;
  const commit = ok => {
    if (done) return;
    done = true;
    const v = input.value.trim();
    if (ok && v && v !== old) {
      if (d.kind === 'output') { const o = byId(d.id); if (o) { o.title = v; o.updatedAt = Date.now(); save(); renderOutputs(); } }
      if (d.kind === 'todo') { const t = todosToday().find(x => x.id === d.id); if (t) { t.text = v; save(); renderTodos(); } }
      toast('已更新');
    }
    renderSpot(spotInput.value);
  };
  input.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') commit(true);
    if (ev.key === 'Escape') commit(false);
  });
  input.addEventListener('blur', () => commit(true));
  input.addEventListener('click', ev => ev.stopPropagation());
}

/* 全域快捷鍵 */
document.addEventListener('keydown', e => {

/* ============================================================

$('#btn-export').addEventListener('click', () => {

$('#btn-restore').addEventListener('click', function () {

$('#restore-file').addEventListener('change', e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const obj = JSON.parse(r.result);
      if (!obj || typeof obj !== 'object' || !(obj.todos || obj.outputs || obj.reflect)) throw new Error('bad');
      localStorage.setItem(KEY, JSON.stringify(obj));
      location.reload();

});

/* ============================================================
   模組四：月度雙手帳 + 出版級 PDF 引擎
   ============================================================ */
let nbTab = 'morning';
let nbMonth = null;   // { y, m }
const nbOverlay = $('#nb-overlay');
const NB_WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];

function nbOpen(monthOffset = 0) {
  const n = new Date();
  const d = new Date(n.getFullYear(), n.getMonth() + monthOffset, 1);
  nbMonth = { y: d.getFullYear(), m: d.getMonth() + 1 };
  renderNb();
  nbOverlay.classList.add('open');
  syncDim();
}
function nbClose() {
  nbOverlay.classList.remove('open');
  syncDim();
}
function nbDaysIn(y, m) { return new Date(y, m, 0).getDate(); }
function nbKey(y, m, d) { return `${y}-${pad(m)}-${pad(d)}`; }

const NB_CHK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="var(--accent)"/><path d="M7.5 12.5l3 3 6-6.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const NB_CIRCLE = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="3.4 3.6" stroke-linecap="round"/></svg>';

function renderNb() {
  if (!nbMonth) return;
  const { y, m } = nbMonth;
  const dim = nbDaysIn(y, m);
  const now = new Date();
  const isCur = now.getFullYear() === y && (now.getMonth() + 1) === m;
  const lastD = isCur ? now.getDate() : dim;

  /* 扉頁：生命星圖（晨間節律） */
  let full = 0;
  const cells = [];
  for (let d = 1; d <= dim; d++) {
    let cls = 'future';
    if (d <= lastD) {
      const list = state.todos[nbKey(y, m, d)] || [];
      const done = list.filter(t => t.done).length;
      if (list.length && done === list.length) { cls = 'full'; full++; }
      else if (done > 0) cls = 'part';
      else cls = 'empty';
    }
    cells.push(`<div class="lg-cell"><span class="lg-dot ${cls}"></span><span class="lg-n">${d}</span></div>`);
  }
  const rate = lastD ? Math.round(full / lastD * 100) : 0;
  let nbNights = 0;
  const nbOutDays = new Set();
  for (let d = 1; d <= lastD; d++) {
    const r = state.reflect[nbKey(y, m, d)];
    if (r && (String(r.win || '').trim() || String(r.weak || '').trim() || String(r.step || '').trim())) nbNights++;
  }
  state.outputs.forEach(o => (o.stamps || []).forEach(ts => {
    if (!ts) return;
    const dt = new Date(Number(ts));
    if (dt.getFullYear() === y && (dt.getMonth() + 1) === m) nbOutDays.add(dt.getDate());
  }));

  /* 內頁日塊 */
  let blocks = '';
  if (nbTab === 'morning') {
    for (let d = 1; d <= lastD; d++) {
      const list = state.todos[nbKey(y, m, d)] || [];
      if (!list.length) continue;
      const wd = NB_WEEKDAYS[new Date(y, m - 1, d).getDay()];
      blocks += `<div class="nb-day"><h4>${m} 月 ${d} 日 ・ 週${wd}</h4><ul>${
        list.map(t => `<li class="${t.done ? 'done' : ''}">${t.done ? NB_CHK : NB_CIRCLE}${esc(t.text)}</li>`).join('')}</ul></div>`;
    }
  } else {
    for (let d = 1; d <= lastD; d++) {
      const r = state.reflect[nbKey(y, m, d)];
      if (!r) continue;
      const lines = [
        ['win', '今天最值得肯定的一刻'],
        ['weak', '覺察到的一個小弱點'],
        ['step', '明天最想邁出的一小步'],
      ].filter(([f]) => String(r[f] || '').trim())
       .map(([f, lab]) => `<p class="nb-ref"><span class="nb-ref-l">✦ ${lab}</span>${esc(r[f])}</p>`);
      if (!lines.length) continue;
      const wd = NB_WEEKDAYS[new Date(y, m - 1, d).getDay()];
      blocks += `<div class="nb-day"><h4>${m} 月 ${d} 日 ・ 週${wd}</h4>${lines.join('')}</div>`;
    }
  }

  $('#nb-sheet').innerHTML = `
    <div class="nb-front">
      <p class="nb-kicker">${y} 年 ${m} 月 ・ 扉頁</p>
      <h3 class="nb-grid-title">生命星圖 · ${dim} 天</h3>
      <div class="lg-grid">${cells.join('')}</div>
      <p class="lg-rate">${rate}% 節律達成率</p>
      <p class="lg-extra">晚思 ${nbNights} 晚 ・ 輸出打卡 ${nbOutDays.size} 天</p>
      <p class="lg-legend"><span title="當日待辦全部完成"><i class="lg-dot full"></i>全達成</span><span title="當日待辦完成至少一件"><i class="lg-dot part"></i>完成 ≥1</span><span title="當日沒有留下待辦"><i class="lg-dot empty"></i>無待辦</span><span title="日期尚未到達"><i class="lg-dot future"></i>未到</span></p>
    </div>
    ${blocks || `<p class="nb-empty">${nbTab === 'morning' ? '本月尚無晨間軌跡。' : '本月尚無晚思留痕。'}</p>`}`;
}

$('#btn-nb').addEventListener('click', () => { playClick(); nbOpen(0); });
$('#nb-close').addEventListener('click', nbClose);
nbOverlay.addEventListener('click', e => { if (e.target === nbOverlay) nbClose(); });

/* 月度時令提醒：當月最後一天或次月前 2 天，每日至多一次 */
function nbNudgeCheck() {
  const n = new Date();
  const dim = nbDaysIn(n.getFullYear(), n.getMonth() + 1);
  const edge = n.getDate() === dim || n.getDate() <= 2;
  if (!edge) return;
  const t = todayStr();
  if ((state.ui.nbNudge || '') === t) return;
  state.ui.nbNudge = t;

  const mn = new Date(n.getFullYear(), n.getMonth() + 1 + prev, 1);

}

/* ============================================================
   磁盤持久層：本地 JSON 自動同步——瀏覽器資料被清也能自動復原
   ============================================================ */
let diskDir = null;
let diskReady = false;
function richness(s) {
  return (s.outputs || []).length + Object.keys(s.todos || {}).length + Object.keys(s.reflect || {}).length;
}
function idbOpen() {
  return new Promise((res, rej) => {
    const rq = indexedDB.open('klingon-fs', 1);
    rq.onupgradeneeded = () => { rq.result.createObjectStore('handles'); };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbSet(k, v) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(v, k);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(k) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('handles', 'readonly');
    const rq = tx.objectStore('handles').get(k);
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
function diskLabel() {
  const el = $('#btn-disk-label'); if (!el) return;
  el.textContent = diskReady ? '本地存檔 ✓' : '啟用本地存檔';
}
async function diskWrite() {
  if (!diskDir || !diskReady) return;
  try {
    const fh = await diskDir.getFileHandle('klingon-data.json', { create: true });
    const w = await fh.createWritable();
    await w.write(JSON.stringify({ savedAt: Date.now(), data: state }));
    await w.close();
  } catch (e) {}
}
async function diskPullIfNewer() {
  try {
    const fh = await diskDir.getFileHandle('klingon-data.json', { create: false });
    const obj = JSON.parse(await (await fh.getFile()).text());
    if (!obj || !obj.data) return;
    const localAt = Number(localStorage.getItem('klingon.savedAt')) || 0;
    if ((Number(obj.savedAt) || 0) > localAt && richness(obj.data) > 0) {
      localStorage.setItem(KEY, JSON.stringify(obj.data));
      localStorage.setItem('klingon.savedAt', String(obj.savedAt));
      location.reload();
    }
  } catch (e) {}
}
async function diskEnable() {
  if (!window.showDirectoryPicker) { toast('此瀏覽器不支援本地檔案同步'); return; }
  try {
    diskDir = await window.showDirectoryPicker({ id: 'klingonData', mode: 'readwrite' });
    await idbSet('dir', diskDir);
    let restored = false;
    try {
      const fh = await diskDir.getFileHandle('klingon-data.json', { create: false });
      const obj = JSON.parse(await (await fh.getFile()).text());
      if (obj && obj.data && richness(obj.data) > richness(state)) {
        if (confirm(`本地存檔裡有更完整的資料（${richness(obj.data)} 項 > 目前 ${richness(state)} 項）。\n要復原嗎？（確定 = 復原並重新載入）`)) {
          localStorage.setItem(KEY, JSON.stringify(obj.data));
          localStorage.setItem('klingon.savedAt', String(obj.savedAt || Date.now()));
          location.reload();
          restored = true;
        }
      }
    } catch (e) {}
    if (restored) return;
    localStorage.setItem('klingon.savedAt', String(Date.now()));
    diskReady = true;
    await diskWrite();
    diskLabel();
    toast('本地存檔已啟用，此後自動同步');
  } catch (e) {}
}
async function diskInit() {
  try {
    const h = await idbGet('dir');
    if (!h) { diskLabel(); return; }
    diskDir = h;
    const p = await h.queryPermission({ mode: 'readwrite' });
    if (p === 'granted') {
      diskReady = true;
      await diskPullIfNewer();
    } else {
      const grant = async () => {
        try {
          if ((await h.requestPermission({ mode: 'readwrite' })) === 'granted') {
            diskReady = true;
            await diskPullIfNewer();
            diskLabel();
          }
        } catch (err) {}
        document.removeEventListener('pointerdown', grant, true);
      };
      document.addEventListener('pointerdown', grant, { capture: true });
    }
  } catch (e) {}
  diskLabel();
}
$('#btn-disk').addEventListener('click', () => {
  if (diskReady) { diskWrite(); toast('已同步到本地檔案'); }
  else diskEnable();
});

/* ---------- 安全快照救援：目前存量明顯少於上一份快照時，提議一鍵復原 ---------- */
function snapshotRescue() {
  try {
    const raw = localStorage.getItem(KEY + '.snapshot');
    if (!raw || isTrivial(raw)) return;
    const snap = JSON.parse(raw);
    const n = richness(snap);
    const cur = richness(state);
    // 只要快照比現在豐富，就提出復原。缺口越大提示越強烈。
    if (n > cur && confirm(
      `偵測到一份比目前更完整的歷史快照。\n\n` +
      `　快照：${(snap.outputs || []).length} 篇輸出、${Object.keys(snap.todos || {}).length} 天待辦、${Object.keys(snap.reflect || {}).length} 天回顧\n` +
      `　目前：${state.outputs.length} 篇輸出、${Object.keys(state.todos || {}).length} 天待辦、${Object.keys(state.reflect || {}).length} 天回顧\n\n` +
      `要復原到快照版本嗎？（確定 = 復原並重新載入）`
    )) {
      // 復原前先保住現況，避免復原後又遺失
      localStorage.setItem('klingon.v1.beforeRescue', JSON.stringify(state));
      localStorage.setItem(KEY, raw);
      location.reload();
    }
  } catch (e) {}
}

/* ---------- 歷史版本：把自動輪替備份清單呈現出來，可一鍵還原 ---------- */
function listBackups() {
  try {
    const l = JSON.parse(localStorage.getItem(BACKUP_KEY) || '[]');
    return Array.isArray(l) ? l : [];
  } catch (e) { return []; }
}
function fmtWhen(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function openHistory() {
  const box = $('#hist-list');
  if (!box) return;
  const list = listBackups().slice().reverse();
  const cur = JSON.stringify(state);
  if (!list.length) {
    box.innerHTML = '<div class="hist-empty">目前還沒有歷史版本。<br>之後每次自動儲存都會在此留下一個還原點，<br>就算內容被覆蓋也能找回。</div>';
  } else {
    box.innerHTML = list.map((b, i) => {
      let m = {};
      try { m = JSON.parse(b.data); } catch (e) { m = {}; }
      const outs = (m.outputs || []).filter(o => !o.archived).length;
      const td = Object.keys(m.todos || {}).length;
      const rf = Object.keys(m.reflect || {}).length;
      const isCur = b.data === cur;
      return `<div class="hist-row">
        <div class="h-when">
          <div class="h-time">${fmtWhen(b.ts)} ${isCur ? '<span class="h-cur">目前</span>' : ''}</div>
          <div class="h-meta">${outs} 篇輸出 · ${td} 天待辦 · ${rf} 天回顧</div>
        </div>
        ${isCur ? '' : `<button class="btn-plain" data-hist="${i}">還原</button>`}
      </div>`;
    }).join('');
    box.querySelectorAll('[data-hist]').forEach(btn => {
      btn.onclick = () => {
        const b = list[Number(btn.dataset.hist)];
        if (!b) return;
        if (!confirm(`要還原到 ${fmtWhen(b.ts)} 的版本嗎？\n\n目前版本會先自動存檔，不用擔心。`)) return;
        try {
          localStorage.setItem(KEY + '.beforeRescue', JSON.stringify(state));
          localStorage.setItem(KEY, b.data);
          location.reload();
        } catch (e) { toast('還原失敗'); }
      };
    });
  }
  $('#hist-overlay').classList.add('show');
}
$('#btn-history').addEventListener('click', openHistory);
$('#hist-close').addEventListener('click', () => $('#hist-overlay').classList.remove('show'));
$('#hist-overlay').addEventListener('click', e => { if (e.target.id === 'hist-overlay') e.currentTarget.classList.remove('show'); });

/* ---------- 啟動 ---------- */
function init() {
  applyCollapsed();
  tickClock();
  setInterval(tickClock, 15000);
  const h = new Date().getHours();
  setView(h < 11 ? 'morning' : h < 21 ? 'output' : 'night');
  renderCatBar();
  snapshotRescue();
  diskInit();
  nbNudgeCheck();
}
init();
</script>
